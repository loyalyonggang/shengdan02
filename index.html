<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圣诞快乐 - 二妞</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zcool+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <canvas id="treeCanvas"></canvas>
        <!-- 旧的静态文字移除，改为打字机容器 -->
        <div class="typing-container" id="typingContainer"></div>
        
        <!-- 动漫人物 -->
        <div class="couple-container">
            <!-- 男生 -->
            <div class="character boy">
                <svg viewBox="0 0 100 150" width="80" height="120">
                    <defs>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="2" result="blur"/>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                        </filter>
                    </defs>
                    <!-- 身体 -->
                    <path d="M30 80 Q50 140 70 80 L70 130 L30 130 Z" fill="#2c3e50" />
                    <!-- 腿 -->
                    <path d="M35 130 L35 150 M65 130 L65 150" stroke="#2c3e50" stroke-width="8"/>
                    <!-- 头 -->
                    <circle cx="50" cy="50" r="35" fill="#f1c40f"/>
                    <!-- 头发 -->
                    <path d="M15 50 Q20 10 50 10 Q80 10 85 50 Q85 30 50 20 Q15 30 15 50" fill="#2c3e50"/>
                    <!-- 眼睛 -->
                    <circle cx="35" cy="55" r="3" fill="#000"/>
                    <circle cx="65" cy="55" r="3" fill="#000"/>
                    <!-- 腮红 -->
                    <circle cx="25" cy="65" r="3" fill="#e74c3c" opacity="0.5"/>
                    <circle cx="75" cy="65" r="3" fill="#e74c3c" opacity="0.5"/>
                    <!-- 围巾 -->
                    <path d="M25 80 Q50 95 75 80" stroke="#e74c3c" stroke-width="8" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- 爱心 -->
            <div class="heart">❤️</div>

            <!-- 女生 -->
            <div class="character girl">
                <svg viewBox="0 0 100 150" width="80" height="120">
                    <!-- 裙子 -->
                    <path d="M30 80 L20 130 L80 130 L70 80 Z" fill="#e74c3c"/>
                    <!-- 腿 -->
                    <path d="M35 130 L35 150 M65 130 L65 150" stroke="#333" stroke-width="4"/>
                    <!-- 头 -->
                    <circle cx="50" cy="50" r="35" fill="#f1c40f"/>
                    <!-- 头发 -->
                    <path d="M10 50 Q10 10 50 10 Q90 10 90 50 L90 80 Q90 100 50 100 Q10 100 10 80 Z" fill="#8e44ad"/>
                    <!-- 眼睛 -->
                    <circle cx="35" cy="55" r="3" fill="#000"/>
                    <circle cx="65" cy="55" r="3" fill="#000"/>
                    <!-- 腮红 -->
                    <circle cx="25" cy="65" r="3" fill="#e74c3c" opacity="0.5"/>
                    <circle cx="75" cy="65" r="3" fill="#e74c3c" opacity="0.5"/>
                    <!-- 围巾 -->
                    <path d="M25 80 Q50 95 75 80" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        
        <!-- 音乐控制按钮 -->
        <div class="music-control" id="musicControl">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="music-icon">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto" autoplay>
        <source src="bg.mp3" type="audio/mpeg">
        您的浏览器不支持 audio 元素。
    </audio>

    <script src="script.js"></script>
</body>
</html>
